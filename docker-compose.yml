services:
  concordium-verifier:
    image: concordium/credential-verification-service:0.1.0
    platform: linux/amd64
    container_name: concordium-verifier
    restart: unless-stopped
    expose:
      - "8000"
      - "8001"
    environment:
      CREDENTIAL_VERIFICATION_SERVICE_NODE_GRPC_ENDPOINT: "${CONCORDIUM_NODE_GRPC:-https://grpc.testnet.concordium.com:20000}"
      CREDENTIAL_VERIFICATION_SERVICE_API_ADDRESS: "0.0.0.0:8000"
      CREDENTIAL_VERIFICATION_SERVICE_MONITORING_ADDRESS: "0.0.0.0:8001"
      CREDENTIAL_VERIFICATION_SERVICE_LOG_LEVEL: "${LOG_LEVEL:-info}"
      CREDENTIAL_VERIFICATION_SERVICE_ACCOUNT: "/keys/verifier_account.export"
    volumes:
      - ./keys/private.export:/keys/verifier_account.export:ro

  api:
    build: .
    container_name: web3-id-verify-api
    restart: unless-stopped
    depends_on:
      - concordium-verifier
    ports:
      - "${PORT:-8084}:8084"
    networks:
      - default
      - aesirx-scanner
    environment:
      PORT: 8084
      NODE_ENV: production
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      VERIFIER_SERVICE_URL: "http://concordium-verifier:8000"
      CONCORDIUM_NETWORK: "${CONCORDIUM_NETWORK:-testnet}"
      DEFAULT_CONTEXT_STRING: "${DEFAULT_CONTEXT_STRING:-Age and country verification for site access}"
      DEFAULT_RESOURCE_ID: "${DEFAULT_RESOURCE_ID:-/}"
      VERIFICATION_SESSION_TTL: "${VERIFICATION_SESSION_TTL:-300}"
      # AesirX Proof Service — Redis is the existing aesirx_redis on the
      # aesirx-scanner network. Set REDIS_PASSWORD in this project's .env to
      # match the password aesirx_redis was started with.
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-aps}"
      CONCORDIUM_NODE_HOST: "${CONCORDIUM_NODE_HOST:-grpc.testnet.concordium.com}"
      CONCORDIUM_NODE_PORT: "${CONCORDIUM_NODE_PORT:-20000}"
      CONCORDIUM_NODE_TLS: "${CONCORDIUM_NODE_TLS:-true}"
      AESIRX_ACCOUNT_ADDRESS: "${AESIRX_ACCOUNT_ADDRESS:-}"
      AESIRX_PRIVATE_KEY: "${AESIRX_PRIVATE_KEY:-}"
      ANCHOR_FINALITY_TIMEOUT_MS: "${ANCHOR_FINALITY_TIMEOUT_MS:-60000}"
      HMAC_TIMESTAMP_SKEW_SEC: "${HMAC_TIMESTAMP_SKEW_SEC:-300}"
      IDEMPOTENCY_TTL_SEC: "${IDEMPOTENCY_TTL_SEC:-86400}"
      BATCH_WINDOW_SEC: "${BATCH_WINDOW_SEC:-300}"
      MAX_LEAVES_PER_BATCH: "${MAX_LEAVES_PER_BATCH:-1024}"

networks:
  aesirx-scanner:
    external: true
